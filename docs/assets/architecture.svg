<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8590"/>
    </marker>
  </defs>

  <rect width="1100" height="360" fill="url(#bg2)" rx="10"/>

  <!-- Title -->
  <text x="40" y="36" font-size="18" font-weight="700" fill="#e6edf3" letter-spacing="-0.3">How a job flows through nocoly-explorer</text>
  <text x="40" y="56" font-size="12" fill="#7d8590">from HTTP submission to Parquet on disk · one async fetch, one sync write</text>

  <!-- Stage 1: Client -->
  <g transform="translate(40, 100)">
    <rect width="160" height="220" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="80" y="28" text-anchor="middle" font-size="10" font-weight="600" fill="#7d8590" letter-spacing="1.2">CALLER</text>
    <text x="80" y="60" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">n8n · Airflow</text>
    <text x="80" y="78" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">· curl · script</text>

    <line x1="20" y1="100" x2="140" y2="100" stroke="#30363d"/>

    <text x="80" y="124" text-anchor="middle" font-size="10" font-weight="600" fill="#58a6ff" letter-spacing="0.5">POST /jobs</text>

    <text x="80" y="156" text-anchor="middle" font-size="11" fill="#7d8590">+ auth header</text>
    <text x="80" y="172" text-anchor="middle" font-size="11" fill="#7d8590">+ job params</text>

    <text x="80" y="200" text-anchor="middle" font-size="10" font-weight="600" fill="#3fb950">200 {job_id}</text>
  </g>

  <!-- arrow to FastAPI -->
  <line x1="208" y1="200" x2="248" y2="200" stroke="#7d8590" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="228" y="190" text-anchor="middle" font-size="10" fill="#7d8590">HTTP</text>

  <!-- Stage 2: FastAPI -->
  <g transform="translate(256, 100)">
    <rect width="200" height="220" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="100" y="28" text-anchor="middle" font-size="10" font-weight="600" fill="#bc8cff" letter-spacing="1.2">LAYER 3</text>
    <text x="100" y="58" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">FastAPI service</text>
    <text x="100" y="78" text-anchor="middle" font-size="11" fill="#7d8590">create_app()</text>

    <line x1="20" y1="100" x2="180" y2="100" stroke="#30363d"/>

    <g font-size="11" fill="#c9d1d9">
      <text x="22" y="124">· POST /jobs → enqueue</text>
      <text x="22" y="144">· GET /jobs/{id} → status</text>
      <text x="22" y="164">· GET /jobs/{id}/result</text>
      <text x="22" y="184">· POST /jobs/{id}/cancel</text>
    </g>

    <line x1="20" y1="200" x2="180" y2="200" stroke="#30363d"/>
    <text x="100" y="218" text-anchor="middle" font-size="10" fill="#7d8590">JobState</text>
  </g>

  <!-- arrow to Redis -->
  <line x1="464" y1="170" x2="494" y2="170" stroke="#7d8590" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="479" y="160" text-anchor="middle" font-size="10" fill="#7d8590">state</text>

  <!-- Stage 3: Redis + Arq -->
  <g transform="translate(502, 100)">
    <rect width="160" height="220" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="80" y="28" text-anchor="middle" font-size="10" font-weight="600" fill="#d29922" letter-spacing="1.2">QUEUE</text>
    <text x="80" y="58" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">Redis</text>
    <text x="80" y="78" text-anchor="middle" font-size="11" fill="#7d8590">+ Arq</text>

    <line x1="20" y1="100" x2="140" y2="100" stroke="#30363d"/>

    <text x="80" y="124" text-anchor="middle" font-size="10" font-weight="600" fill="#d29922">job:{id}:status</text>
    <text x="80" y="142" text-anchor="middle" font-size="10" font-weight="600" fill="#d29922">job:{id}:result</text>
    <text x="80" y="160" text-anchor="middle" font-size="10" font-weight="600" fill="#d29922">job:{id}:cancel</text>

    <line x1="20" y1="180" x2="140" y2="180" stroke="#30363d"/>

    <text x="80" y="200" text-anchor="middle" font-size="10" fill="#7d8590">survives</text>
    <text x="80" y="216" text-anchor="middle" font-size="10" fill="#7d8590">worker restart</text>
  </g>

  <!-- arrow to Worker -->
  <line x1="670" y1="200" x2="710" y2="200" stroke="#7d8590" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="690" y="190" text-anchor="middle" font-size="10" fill="#7d8590">dequeue</text>

  <!-- Stage 4: Worker -->
  <g transform="translate(718, 100)">
    <rect width="200" height="220" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="100" y="28" text-anchor="middle" font-size="10" font-weight="600" fill="#58a6ff" letter-spacing="1.2">LAYER 2</text>
    <text x="100" y="58" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">Arq worker</text>
    <text x="100" y="78" text-anchor="middle" font-size="11" fill="#7d8590">run_job()</text>

    <line x1="20" y1="100" x2="180" y2="100" stroke="#30363d"/>

    <text x="100" y="124" text-anchor="middle" font-size="10" font-weight="600" fill="#58a6ff">1. fetch async</text>
    <text x="100" y="142" text-anchor="middle" font-size="10" fill="#7d8590">AsyncWorksheetClient</text>

    <text x="100" y="170" text-anchor="middle" font-size="10" font-weight="600" fill="#58a6ff">2. write sync</text>
    <text x="100" y="188" text-anchor="middle" font-size="10" fill="#7d8590">StreamingExporter</text>

    <line x1="20" y1="200" x2="180" y2="200" stroke="#30363d"/>

    <text x="100" y="218" text-anchor="middle" font-size="10" fill="#3fb950">cooperative cancel</text>
  </g>

  <!-- arrow to Nocoly -->
  <line x1="800" y1="120" x2="800" y2="60" stroke="#7d8590" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="810" y="92" font-size="10" fill="#7d8590">GET /rows?page=N</text>

  <!-- arrow back to Worker (response) -->
  <line x1="800" y1="60" x2="800" y2="120" stroke="#7d8590" stroke-width="1.5" marker-end="url(#arrow)" opacity="0"/>

  <!-- Nocoly box (above Worker) -->
  <g transform="translate(720, 30)">
    <rect width="196" height="22" rx="4" fill="#1c2129" stroke="#30363d"/>
    <text x="98" y="15" text-anchor="middle" font-size="11" font-weight="600" fill="#e6edf3">Nocoly HTTP API</text>
  </g>

  <!-- arrow to Parquet sink (down from Worker) -->
  <line x1="818" y1="320" x2="818" y2="340" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Parquet sink -->
  <g transform="translate(720, 340)">
    <text x="98" y="14" text-anchor="middle" font-size="10" font-weight="600" fill="#3fb950">Parquet on disk / S3</text>
  </g>

</svg>
